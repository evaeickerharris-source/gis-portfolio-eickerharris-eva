<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choropleth Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f4f1e8;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 620px;
    }

    .info {
      padding: 8px 10px;
      font: 14px/16px Arial, Helvetica, sans-serif;
      background: rgba(244,241,232,0.95);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      color: #191919;
    }

    .info h4 {
      margin: 0 0 6px;
      color: #604027;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .legend {
      line-height: 1.4;
      color: #191919;
    }

    .legend i {
      width: 16px;
      height: 16px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
      border: 1px solid rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="wompar_2020_data.js"></script>
  <script>
    const map = L.map('map', {
      minZoom: 2,
      maxBoundsViscosity: 1.0,
      scrollWheelZoom: true,
      dragging: true,
      touchZoom: true,
      doubleClickZoom: true,
      boxZoom: true,
      keyboard: true
    }).setView([20, 10], 2);

    map.setMaxBounds([[-90, -180], [90, 180]]);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    function getColor(d) {
      return d > 60 ? '#004937' :
             d > 40 ? '#006e4f' :
             d > 30 ? '#2a8a47' :
             d > 20 ? '#78c679' :
             d > 10 ? '#c2e699' :
             d >= 0 ? '#ffffd4' :
                      '#a19f9f';
    }

    function style(feature) {
      const value = Number(feature?.properties?.SG_GEN_PARL_2020);
      return {
        weight: 1,
        opacity: 1,
        color: '#6d6d6d',
        dashArray: '',
        fillOpacity: 0.75,
        fillColor: Number.isFinite(value) ? getColor(value) : '#a19f9f'
      };
    }

    const info = L.control({ position: 'topright' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info');
      this.update();
      return this._div;
    };

    info.update = function (props) {
      const value = props?.SG_GEN_PARL_2020;
      const display = (value === null || value === undefined || value === '') ? 'No data' : `${value}% of seats held by women`;
      const country = props?.nam_en || 'a country';
      this._div.innerHTML = `<h4>5.5.1 Women in parliament</h4>${props ? `<b>${country}</b><br>${display}` : 'Hover over a country'}`;
    };
    info.addTo(map);

    let geojsonLayer;

    function highlightFeature(e) {
      const layer = e.target;
      layer.setStyle({
        weight: 2.2,
        color: '#303030',
        fillOpacity: 0.85
      });
      layer.bringToFront();
      info.update(layer.feature.properties);
    }

    function resetHighlight(e) {
      geojsonLayer.resetStyle(e.target);
      info.update();
    }

    function zoomToFeature(e) {
      map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: zoomToFeature
      });
    }

    const legend = L.control({ position: 'bottomleft' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info legend');
      const grades = [0, 10, 20, 30, 40, 60];
      const labels = [];

      for (let i = 0; i < grades.length; i++) {
        const from = grades[i];
        const to = grades[i + 1];
        labels.push(`<i style="background:${getColor(from + 1)}"></i> ${from}${to ? `-${to}` : '+'}`);
      }

      labels.push('<i style="background:#a19f9f"></i> No Data');
      div.innerHTML = labels.join('<br>');
      return div;
    };
    legend.addTo(map);

    if (typeof nationData !== 'undefined' && nationData?.features?.length) {
      geojsonLayer = L.geoJson(nationData, { style, onEachFeature }).addTo(map);
    } else {
      document.getElementById('map').innerHTML = '<p style="padding:1rem;color:#604027;">Could not load map data</p>';
    }

    map.attributionControl.addAttribution('SDG data &copy; <a href="https://unstats-undesa.opendata.arcgis.com/">UN SDG DataHub</a>');
  </script>
</body>
</html>
